name: Update mixtapes
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    paths: [config.json, template.html, build.py]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - run: |
          git config user.name "mixtapes-bot"
          git config user.email "mixtapes-bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || (git commit -m "Sync playlists" && git push)
